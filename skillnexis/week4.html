<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Amazon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f3f3;
}

/* NAVBAR */
nav {
    background: #131921;
    color: white;
    padding: 15px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #ff9900;
}

.search {
    flex: 1;
    max-width: 600px;
    display: flex;
}

.search input {
    width: 100%;
    padding: 12px;
    border: none;
    outline: none;
}

.search button {
    padding: 12px 20px;
    border: none;
    background: #febd69;
    cursor: pointer;
}

.cart {
    cursor: pointer;
    font-size: 18px;
}

/* PRODUCTS */
.container {
    width: 90%;
    margin: 30px auto;
}

.container h2 {
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px #ccc;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: contain;
}

.card h3 {
    margin: 10px 0;
}

.price {
    color: #b12704;
    font-size: 20px;
    font-weight: bold;
}

.rating {
    color: #f5a623;
    margin: 8px 0;
}

button {
    cursor: pointer;
}

.card button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 5px;
}

.details {
    background: #ddd;
}

.add {
    background: #ffd814;
}

/* POPUP */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 600px;
    padding: 25px;
    border-radius: 10px;
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 25px;
    cursor: pointer;
}

.modal-content img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    display: block;
    margin: auto;
}

.modal-content h2 {
    margin: 15px 0;
}

.modal-content button {
    background: #ffd814;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    margin-top: 15px;
}

/* CART */
.cart-page {
    display: none;
    width: 90%;
    margin: 30px auto;
}

.cart-item {
    background: white;
    margin: 10px 0;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 8px;
}

.remove {
    background: #ff4d4d;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
}

.total {
    background: white;
    padding: 20px;
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* MOBILE */
@media(max-width:600px) {
    nav {
        flex-wrap: wrap;
    }

    .search {
        order: 3;
        width: 100%;
    }

    .cart-item {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">Mini Amazon</div>

    <div class="search">
        <input type="text" id="searchBox" placeholder="Search products...">
        <button onclick="searchProducts()">🔍</button>
    </div>

    <div class="cart" onclick="showCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </div>
</nav>

<!-- HOME PAGE -->
<div class="container" id="home">
    <h2>Featured Products</h2>
    <div class="products" id="productList"></div>
</div>

<!-- CART PAGE -->
<div class="cart-page" id="cartPage">
    <h2>Shopping Cart</h2>
    <div id="cartItems"></div>
    <div class="total">
        Total: ₹<span id="totalPrice">0</span>
    </div>

    <button onclick="showHome()" 
            style="margin-top:15px;padding:10px 20px;background:#ffd814;border:0;border-radius:5px;">
        Continue Shopping
    </button>
</div>

<!-- PRODUCT DETAILS POPUP -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>

        <img id="modalImage">

        <h2 id="modalName"></h2>

        <p id="modalDescription"></p>

        <h3 class="price">₹<span id="modalPrice"></span></h3>

        <div class="rating">⭐⭐⭐⭐⭐</div>

        <button onclick="addModalProduct()">
            Add to Cart
        </button>
    </div>
</div>

<script>

const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        price: 1499,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e",
        description: "High quality wireless headphones with comfortable ear cushions and clear sound."
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 2499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30",
        description: "Modern smart watch with fitness tracking and notification support."
    },
    {
        id: 3,
        name: "Laptop",
        price: 59999,
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853",
        description: "Powerful laptop suitable for students, programming and everyday work."
    },
    {
        id: 4,
        name: "Smartphone",
        price: 24999,
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",
        description: "Latest smartphone with a high quality camera and powerful processor."
    },
    {
        id: 5,
        name: "Gaming Mouse",
        price: 999,
        image: "https://images.unsplash.com/photo-1527814050087-3793815479db",
        description: "Ergonomic gaming mouse with accurate tracking and RGB lighting."
    },
    {
        id: 6,
        name: "Bluetooth Speaker",
        price: 1299,
        image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1",
        description: "Portable Bluetooth speaker with powerful audio and long battery life."
    }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let selectedProduct = null;


/* DISPLAY PRODUCTS */

function displayProducts(list = products) {

    const productList = document.getElementById("productList");

    productList.innerHTML = "";

    list.forEach(product => {

        productList.innerHTML += `
        <div class="card">

            <img src="${product.image}" alt="${product.name}">

            <h3>${product.name}</h3>

            <div class="rating">⭐⭐⭐⭐⭐</div>

            <p class="price">₹${product.price}</p>

            <button class="details"
                onclick="showDetails(${product.id})">
                View Details
            </button>

            <button class="add"
                onclick="addToCart(${product.id})">
                Add to Cart
            </button>

        </div>
        `;
    });
}


/* SHOW PRODUCT DETAILS */

function showDetails(id) {

    selectedProduct = products.find(p => p.id === id);

    document.getElementById("modalImage").src =
        selectedProduct.image;

    document.getElementById("modalName").innerText =
        selectedProduct.name;

    document.getElementById("modalDescription").innerText =
        selectedProduct.description;

    document.getElementById("modalPrice").innerText =
        selectedProduct.price;

    document.getElementById("modal").style.display = "flex";
}


/* CLOSE POPUP */

function closeModal() {
    document.getElementById("modal").style.display = "none";
}


/* ADD TO CART */

function addToCart(id) {

    const product = products.find(p => p.id === id);

    cart.push(product);

    saveCart();

    alert(product.name + " added to cart!");
}


/* ADD FROM POPUP */

function addModalProduct() {

    if(selectedProduct) {
        addToCart(selectedProduct.id);
        closeModal();
    }
}


/* SAVE CART */

function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    updateCartCount();
}


/* UPDATE CART COUNT */

function updateCartCount() {

    document.getElementById("cartCount").innerText =
        cart.length;
}


/* SHOW CART */

function showCart() {

    document.getElementById("home").style.display = "none";

    document.getElementById("cartPage").style.display = "block";

    displayCart();
}


/* SHOW HOME */

function showHome() {

    document.getElementById("cartPage").style.display = "none";

    document.getElementById("home").style.display = "block";
}


/* DISPLAY CART */

function displayCart() {

    const cartItems =
        document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let total = 0;

    if(cart.length === 0) {

        cartItems.innerHTML =
            "<p>Your cart is empty.</p>";

    }

    cart.forEach((product, index) => {

        total += product.price;

        cartItems.innerHTML += `
        <div class="cart-item">

            <div>
                <h3>${product.name}</h3>
                <p>₹${product.price}</p>
            </div>

            <button class="remove"
                onclick="removeFromCart(${index})">
                Remove
            </button>

        </div>
        `;
    });

    document.getElementById("totalPrice").innerText =
        total;
}


/* REMOVE PRODUCT */

function removeFromCart(index) {

    cart.splice(index, 1);

    saveCart();

    displayCart();
}


/* SEARCH */

function searchProducts() {

    const search =
        document.getElementById("searchBox")
        .value.toLowerCase();

    const filtered =
        products.filter(product =>
            product.name.toLowerCase()
            .includes(search)
        );

    displayProducts(filtered);
}


/* INITIAL LOAD */

displayProducts();

updateCartCount();

</script>

</body>
</html>
