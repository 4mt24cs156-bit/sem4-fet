<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Amazon - Capstone Project</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- UNIVERSAL NAVIGATION BAR -->
    <nav class="bg-gray-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <button onclick="switchView('shop')" class="text-2xl font-bold tracking-tight text-amber-500 hover:opacity-90">
                mini<span class="text-white">amazon</span>
            </button>
            <div class="flex items-center space-x-4">
                <button id="nav-back-shop" onclick="switchView('shop')" class="text-gray-300 hover:text-white transition text-sm font-medium hidden">
                    ← Back to Shopping
                </button>
                <button id="cart-toggle-btn" onclick="switchView('cart')" class="relative flex items-center bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg transition">
                    <span>🛒 View Cart</span>
                    <span id="cart-badge" class="ml-2 bg-amber-500 text-gray-950 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- VIEW 1: HOME PAGE STOREFRONT -->
    <div id="shop-view" class="flex flex-col flex-grow">
        <!-- Hero Banner -->
        <header class="bg-gradient-to-r from-gray-800 to-gray-700 text-white text-center py-12 px-4 shadow-inner">
            <h1 class="text-4xl font-extrabold mb-2">Exclusive Week 4 Tech Deals</h1>
            <p class="text-gray-300 max-w-xl mx-auto">Explore premium gadgets featuring local storage integration and fully responsive grid design layouts.</p>
        </header>

        <!-- Main Product Catalog Grid -->
        <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Trending Products</h2>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamic product cards inject here -->
            </div>
        </main>
    </div>

    <!-- VIEW 2: DEDICATED SHOPPING CART PAGE -->
    <div id="cart-view" class="flex-grow w-full hidden">
        <main class="max-w-5xl mx-auto px-4 py-10 w-full">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Shopping Cart Manifest</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Side: Dynamic Items List -->
                <div class="lg:col-span-2 space-y-4" id="cart-list-wrapper">
                    <!-- Dynamic cart rows inject here -->
                </div>

                <!-- Right Side: Calculation Receipt Card -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 h-fit space-y-4">
                    <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Order Summary</h3>
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>Items Total Count:</span>
                        <span id="summary-qty">0</span>
                    </div>
                    <div class="flex justify-between text-xl font-extrabold text-gray-900 border-t pt-4">
                        <span>Grand Total:</span>
                        <span id="summary-total">$0.00</span>
                    </div>
                    <button onclick="alert('Order placed successfully! State saved to memory.')" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-lg shadow-md transition tracking-wide">
                        Proceed to Final Checkout
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- GLOBAL PRODUCT DETAILS POPUP MODAL -->
    <div id="product-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            <div id="modal-content" class="space-y-4">
                <!-- Dynamic modal details inject here -->
            </div>
        </div>
    </div>

    <!-- UNIVERSAL FOOTER -->
    <footer class="bg-gray-900 text-gray-400 text-center py-4 text-sm mt-auto">
        <p>&copy; 2026 Mini Amazon Storefront. Front-End Integration Complete.</p>
    </footer>

    <!-- COMBINED JAVASCRIPT APP LOGIC -->
    <script>
        // 1. Static Product Database Catalog
        const PRODUCTS = [
            { 
                id: 1, 
                name: "Premium Wireless Headphones", 
                price: 89.99, 
                image: "https://unsplash.com", 
                desc: "Experience pure audio bliss with active noise cancellation, deep bass output, and ultra-comfortable memory foam earcups for extended listening sessions." 
            },
            { 
                id: 2, 
                name: "Smart Fitness Watch", 
                price: 129.50, 
                image: "https://unsplash.com", 
                desc: "Track custom workouts, monitor blood oxygen saturation, count daily structural steps, and manage cross-platform phone notifications seamlessly." 
            },
            { 
                id: 3, 
                name: "Mechanical Gaming Keyboard", 
                price: 74.99, 
                image: "https://unsplash.com", 
                desc: "Tactile clicky switches designed for rapid input precision, custom robust dynamic RGB backlit setups, and high-performance ergonomic framing." 
            },
            { 
                id: 4, 
                name: "Ergonomic Wireless Mouse", 
                price: 39.99, 
                image: "https://unsplash.com", 
                desc: "Contoured surface profile engineered perfectly for vertical palm stability, variable precision tracking adjustments, and extended battery lifetimes." 
            }
        ];

        // 2. Global State Variable (Loads from Local Storage or starts empty)
        let cart = JSON.parse(localStorage.getItem('mini_amazon_cart')) || [];

        // 3. Initialization Execution Hook
        document.addEventListener('DOMContentLoaded', () => {
            renderProductGrid();
            updateCartState();

            // Background mask modal click listener
            const modal = document.getElementById('product-modal');
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        });

        // 4. View Switcher Routing Logic (SPA Layout Control)
        function switchView(viewName) {
            const shopView = document.getElementById('shop-view');
            const cartView = document.getElementById('cart-view');
            const backBtn = document.getElementById('nav-back-shop');

            if (viewName === 'shop') {
                shopView.classList.remove('hidden');
                cartView.classList.add('hidden');
                backBtn.classList.add('hidden');
            } else if (viewName === 'cart') {
                shopView.classList.add('hidden');
                cartView.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                buildCartView(); // Always re-render cart lists up to date
            }
        }

        // 5. Storefront Renderer
        function renderProductGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = PRODUCTS.map(product => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col group hover:shadow-lg transition">
                    <div class="h-48 bg-gray-100 overflow-hidden">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-bold text-gray-800 text-base mb-1 truncate">${product.name}</h3>
                        <p class="text-amber-600 font-extrabold text-lg mb-4">$${product.price.toFixed(2)}</p>
                        <div class="grid grid-cols-2 gap-2 mt-auto">
                            <button onclick="openModal(${product.id})" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg transition">Details</button>
                            <button onclick="addToCart(${product.id})" class="text-xs bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 rounded-lg transition">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 6. Popup Modal Controllers
        function openModal(id) {
            const product = PRODUCTS.find(p => p.id === id);
            if (!product) return;

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <img src="${product.image}" alt="${product.name}" class="w-full h-64 object-cover rounded-lg">
