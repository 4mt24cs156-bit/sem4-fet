<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
    <style> 
    
    body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.6;
    background-color: #f4f4f4;
    color: #333;
}

header {
    background: #35424a;
    color: rgb(255, 255, 255);
    text-align: center;
    padding: 2rem;
}

section {
    background: #ffffff;
    margin: 20px auto;
    padding: 20px;
    max-width: 800px;
    border-radius: 5px;
}

img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
}

footer {
    text-align: center;
    padding: 10px;
    background: #35424a;
    color: #ffffff;
}
</style>
<body>
    <header>
        <h1>Jane Doe</h1>
        <p>Web Developer & Designer</p>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <img src="img.jpeg" alt="Profile Photo of Ram">
        <p>I am a student learning web design and building modern web pages.</p>
    </section>

    <section id="education">
        <h2>Education</h2>
        <p>Bachelor of Science in Computer Science -  MITE</p>
    </section>

    <section id="skills">
        <h2>Skills</h2>
        <ul>
            <li>HTML5 & CSS3</li>
            <li>Basic JavaScript</li>
            <li>Responsive Design</li>
        </ul>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: ram.@gmail.com</p>
    </section>

    <footer>
        <p>&copy; ram</p>
    </footer>
</body>
</html>
