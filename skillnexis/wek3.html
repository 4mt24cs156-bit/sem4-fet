<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74ebe5, #89f7fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Card Container */
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .card-title {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    /* Search Box */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #007bff;
    }

    .search-box button {
      padding: 12px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .search-box button:hover {
      background-color: #0056b3;
    }

    /* Weather Display */
    .weather-info {
      margin-top: 15px;
    }

    .weather-info h2 {
      font-size: 1.6rem;
      color: #222;
    }

    .temp-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .temp-container img {
      width: 64px;
      height: 64px;
    }

    #temperature {
      font-size: 2.8rem;
      font-weight: bold;
      color: #111;
    }

    .condition {
      font-size: 1.1rem;
      color: #666;
      text-transform: capitalize;
      margin-bottom: 20px;
    }

    .details {
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .detail-item .label {
      color: #777;
    }

    .detail-item .value {
      font-weight: 600;
      color: #333;
    }

    /* Error & Utility Classes */
    .error {
      color: #dc3545;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="card-title">Weather App</h1>
    
    <!-- Search Form -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" />
      <button id="searchBtn">Search</button>
    </div>

    <!-- Error Message Display -->
    <p id="errorMessage" class="error hidden"></p>

    <!-- Weather Display Area -->
    <div id="weatherDisplay" class="weather-info hidden">
      <h2 id="cityName">--</h2>
      <div class="temp-container">
        <img id="weatherIcon" src="" alt="Weather Icon" />
        <span id="temperature">--</span>
      </div>
      <p id="weatherCondition" class="condition">--</p>
      
      <div class="details">
        <div class="detail-item">
          <span class="label">Humidity</span>
          <span id="humidity" class="value">--%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // OpenWeatherMap API Configuration
    // Replace 'YOUR_API_KEY_HERE' with your actual key from OpenWeatherMap
    const API_KEY = 'YOUR_API_KEY_HERE';
    const BASE_URL = 'https://api.openweathermap.org/data/2.5/weather';

    // DOM Element References
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const errorMessage = document.getElementById('errorMessage');
    const weatherDisplay = document.getElementById('weatherDisplay');

    const cityNameEl = document.getElementById('cityName');
    const temperatureEl = document.getElementById('temperature');
    const weatherIconEl = document.getElementById('weatherIcon');
    const weatherConditionEl = document.getElementById('weatherCondition');
    const humidityEl = document.getElementById('humidity');

    // Event Listeners
    searchBtn.addEventListener('click', handleSearch);
    cityInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        handleSearch();
      }
    });

    function handleSearch() {
      const city = cityInput.value.trim();
      if (city) {
        getWeatherData(city);
      } else {
        showError('Please enter a city name.');
      }
    }

    // Fetch Weather Data using Fetch API (Async/Await)
    async function getWeatherData(city) {
      try {
        const url = `${BASE_URL}?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;
        
        const response = await fetch(url);
        
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('City not found. Please check spelling.');
          } else if (response.status === 401) {
            throw new Error('Invalid API Key. Please add a valid key.');
          } else {
            throw new Error('Failed to fetch weather data. Try again later.');
          }
        }

        const data = await response.json();
        displayWeather(data);
      } catch (error) {
        showError(error.message);
      }
    }

    // Update DOM Elements with JSON Data
    function displayWeather(data) {
      hideError();

      const city = data.name;
      const country = data.sys.country;
      const temp = Math.round(data.main.temp);
      const humidity = data.main.humidity;
      const condition = data.weather[0].description;
      const iconCode = data.weather[0].icon;

      cityNameEl.textContent = `${city}, ${country}`;
      temperatureEl.textContent = `${temp}°C`;
      weatherConditionEl.textContent = condition;
      humidityEl.textContent = `${humidity}%`;
      weatherIconEl.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
      weatherIconEl.alt = condition;

      weatherDisplay.classList.remove('hidden');
    }

    // Helper Functions
    function showError(message) {
      weatherDisplay.classList.add('hidden');
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.textContent = '';
      errorMessage.classList.add('hidden');
    }
  </script>
</body>
</html>
