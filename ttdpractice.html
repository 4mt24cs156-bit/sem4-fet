    <form id="ttdForm" autocomplete="off" onsubmit="event.preventDefault();">
        
        <!-- FIX: Swapped restricted table cells for an independent scrolling container wrapper -->
        <div class="scrollable-form-container" id="formFieldsContainer">
            <!-- Dynamic vertical cards can now scale and stack natively inside -->
        </div>

        <!-- Actions -->
        <div class="portal-footer-actions">
            <button type="button" class="ttd-btn ttd-btn-default" id="resetBtn">Reset Test</button>
            <button type="button" class="ttd-btn ttd-btn-primary" id="submitBtn">Verify Data</button>
        </div>
    </form>
</div>

<!-- Add these updated styles to your existing <style> tag to support the layout change -->
<style>
    /* New modern wrapper supporting overflow properties */
    .scrollable-form-container {
        max-height: 480px;
        overflow-y: auto;
        background-color: #f8f9fa;
        padding: 20px;
        box-sizing: border-box;
    }

    .vertical-form-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 25px;
        background-color: #ffffff;
        border: 1px solid var(--border-gray);
        border-radius: 4px;
        margin-bottom: 20px;
    }
    .vertical-form-card:last-child {
        margin-bottom: 0;
    }

    .card-index-header {
        font-size: 14px;
        font-weight: 700;
        color: var(--ttd-maroon);
        border-bottom: 1px solid #eee;
        padding-bottom: 6px;
        margin-bottom: 4px;
    }

    .form-field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-field-group label {
        font-size: 11px;
        font-weight: 600;
        color: #555555;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        text-align: left;
    }

    .blueprint-data {
        line-height: 1.6;
    }
    
    .blueprint-row {
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px dashed #e0e0e0;
    }
    .blueprint-row:last-child {
        border-bottom: none;
    }
</style>

<script>
    // Configuration & Target Data Bank
    const namesBank = ["Ramanuja Chari", "Srinivas Rao", "Lakshmi Pillai", "K Venkatraman", "Anjali Sharma"];
    const idBank = ["Aadhaar Card", "PAN Card", "Voter ID", "Passport"];
    
    let targetProfiles = [];
    let startTime = null;
    let timerInterval = null;
    let totalKeystrokes = 0;
    let errorKeystrokes = 0;

    // Elements
    const personCountSelect = document.getElementById('personCount');
    const formFieldsContainer = document.getElementById('formFieldsContainer');
    const targetPromptEl = document.getElementById('targetPrompt');
    const timerEl = document.getElementById('timer');
    const wpmEl = document.getElementById('wpm');
    const accuracyEl = document.getElementById('accuracy');
    const resetBtn = document.getElementById('resetBtn');

    // Build interface rows dynamically matching selected quantity
    function buildInterface() {
        // Fallback default value if the person count dropdown element isn't in your HTML view header yet
        const count = personCountSelect ? parseInt(personCountSelect.value) : 1;
        
        formFieldsContainer.innerHTML = '';
        targetProfiles = [];
        let blueprintHTML = '';

        for (let i = 1; i <= count; i++) {
            const randomName = namesBank[Math.floor(Math.random() * namesBank.length)];
            const randomAge = Math.floor(Math.random() * (65 - 18) + 18).toString();
            const randomGender = Math.random() > 0.5 ? "Male" : "Female";
            const randomIdType = idBank[Math.floor(Math.random() * idBank.length)];
            
            let randomIdNum = "";
            if(randomIdType === "Aadhaar Card") randomIdNum = Math.floor(100000000000 + Math.random() * 900000000000).toString();
            else if(randomIdType === "PAN Card") randomIdNum = "ABCDE" + Math.floor(1000 + Math.random() * 9000) + "F";
            else randomIdNum = Math.floor(100000 + Math.random() * 900000).toString();

            targetProfiles.push({
                name: randomName,
                age: randomAge,
                gender: randomGender,
                idproof: randomIdType,
                idnum: randomIdNum
            });

            blueprintHTML += `<div class="blueprint-row"><strong>[Person ${i}]</strong> NAME: ${randomName} | AGE: ${randomAge} | GENDER: ${randomGender} | ID: ${randomIdType} | NUM: ${randomIdNum}</div>`;

            // Append natively styled stacking card layouts safely
            formFieldsContainer.innerHTML += `
                <div class="vertical-form-card">
                    <div class="card-index-header">Person #${i} Details</div>
                    <div class="form-field-group">
                        <label>Name (As in ID Proof)</label>
                        <input type="text" class="ttd-input data-cell" data-index="${i-1}" data-field="name" placeholder="Enter Name">
                    </div>
                    <div class="form-field-group">
                        <label>Age</label>
                        <input type="text" class="ttd-input data-cell" data-index="${i-1}" data-field="age" placeholder="Age">
                    </div>
                    <div class="form-field-group">
                        <label>Gender</label>
                        <select class="ttd-select data-cell" data-index="${i-1}" data-field="gender">
                            <option value="">- Select -</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-field-group">
                        <label>ID Proof Type</label>
                        <select class="ttd-select data-cell" data-index="${i-1}" data-field="idproof">
                            <option value="">- Select -</option>
                            <option value="Aadhaar Card">Aadhaar Card</option>
                            <option value="PAN Card">PAN Card</option>
                            <option value="Voter ID">Voter ID</option>
                            <option value="Passport">Passport</option>
                        </select>
                    </div>
                    <div class="form-field-group">
                        <label>ID Proof Number</label>
                        <input type="text" class="ttd-input data-cell" data-index="${i-1}" data-field="idnum" placeholder="ID Number">
                    </div>
                </div>
            `;
        }

        targetPromptEl.innerHTML = blueprintHTML;
        attachInputListeners();
    }

    function attachInputListeners() {
        const inputCells = document.querySelectorAll('.data-cell');
        inputCells.forEach(cell => {
            cell.addEventListener('input', () => {
                startMetricsTracker();
                totalKeystrokes++;

                const index = parseInt(cell.getAttribute('data-index'));
                const field = cell.getAttribute('data-field');
                const targetValue = targetProfiles[index][field];
                const currentValue = cell.value;

                if (targetValue.indexOf(currentValue) !== 0) {
                    cell.classList.add('input-error-state');
                    errorKeystrokes++;
                } else {
                    cell.classList.remove('input-error-state');
                }
                updateMetrics();
            });
        });
    }

    function startMetricsTracker() {
        if (!startTime) {
            startTime = new Date();
            timerInterval = setInterval(updateMetrics, 500);
        }
    }

    function updateMetrics() {
        if (!startTime) return;
        const timeElapsed = (new Date() - startTime) / 1000;
        timerEl.textContent = Math.floor(timeElapsed) + "s";

        if (timeElapsed > 1) {
            const words = totalKeystrokes / 5;
            const wpm = Math.round(words / (timeElapsed / 60));
            wpmEl.textContent = wpm >= 0 ? wpm : 0;
        }

        if (totalKeystrokes > 0) {
            const score = Math.round(((totalKeystrokes - errorKeystrokes) / totalKeystrokes) * 100);
            accuracyEl.textContent = (score < 0 ? 0 : score) + "%";
        }
    }

    function resetSimulation() {
        clearInterval(timerInterval);
        startTime = null;
        totalKeystrokes = 0;
        errorKeystrokes = 0;
        timerEl.textContent = "0s";
        wpmEl.textContent = "0";
        accuracyEl.textContent = "100%";
        buildInterface();
    }

    resetBtn.addEventListener('click', resetSimulation);
    if(personCountSelect) personCountSelect.addEventListener('change', resetSimulation);

    window.onload = buildInterface;
</script>
